name: Build & release PROJ 9.8

on:
  push:
    tags:
      - proj-v9.8.[0-9]+*
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v6

      - uses: ./.github/actions/setup_tools_shared

      - name: Build PROJ
        shell: bash
        run: ./proj/generate_proj_9_8_libs.sh

      - name: Bundle package
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            ubuntu-22.04) ARCHIVE_NAME="proj-linux.tar.xz" ; FOLDER_NAME="linux" ;;
            macos-14)    ARCHIVE_NAME="proj-macos.tar.xz" ; FOLDER_NAME="mac" ;;
            windows-2022) ARCHIVE_NAME="proj-windows.tar.xz" ; FOLDER_NAME="v10" ;;
          esac

          tar -cJvf "$ARCHIVE_NAME" "$FOLDER_NAME"
          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> $GITHUB_ENV

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: ${{ env.ARCHIVE_NAME }}

  release:
    needs: [build]
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'

    steps:
      - name: Determine version from tag
        shell: bash
        run: echo "PACKAGE_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: staging

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "${{ github.ref_name }}"
          body: 'Build for ${{ github.ref_name }} containing debug, release, static and dynamic files per platform'
          files: staging/**/*.tar.xz
